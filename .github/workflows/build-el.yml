name: Build Greek (el) image

# Builds this fork (DocuSeal + Greek signer translation) for ARM64 (Oracle Ampere)
# and publishes it to GitHub Container Registry as ghcr.io/<owner>/docuseal:el

on:
  push:
    branches: [greek]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docuseal" >> "$GITHUB_OUTPUT"

      - name: Create .version file
        run: echo "el-${GITHUB_SHA::7}" > .version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.img.outputs.name }}:el
            ${{ steps.img.outputs.name }}:el-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
